name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Lint & Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, json, mbstring, spl
          coverage: none

      - name: Verify PHP syntax across all files
        run: |
          find src bin tests -type f -exec php -l {} +

      - name: Execute zero-dependency test suite
        run: |
          php tests/run_tests.php

      - name: Smoke-test CLI on hardened fixture
        run: |
          php bin/lh-mail scan fixtures/hardened_mail_config.json --format sarif

      - name: Smoke-test CLI on vulnerable fixture (expected exit 1)
        run: |
          php bin/lh-mail scan fixtures/vulnerable_mail_config.json --format json || test $? -eq 1

      - name: Smoke-test CLI sign on sample EML
        run: |
          php bin/lh-mail sign fixtures/sample_unsigned.eml --domain logihertz.com --selector sig2026
